<!doctype html><html lang="pt-BR"><head><link rel="icon" type="image/svg+xml" href="/favicon.svg?v=20260830-v332"><link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20260830-v332"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agenda - BarberFlow</title><link rel="stylesheet" href="/style.css?v=20260830-v400"></head><body class="auth-checking"><div id="shell"></div><main class="main"><header class="topbar agenda-topbar"><div><span class="page-eyebrow">OPERAÇÃO</span><h1>Agenda</h1><p>Visualize o dia por profissional e fale com o cliente sem sair do fluxo.</p></div><button id="novo" class="btn btn-primary">+ Novo agendamento</button></header>

<div id="msg" class="notice hidden"></div>
