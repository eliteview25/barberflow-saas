<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agendamentos - BarberFlow</title><link rel="stylesheet" href="/style.css"></head><body><div id="shell"></div><main class="main"><header class="topbar"><div><h1>Agendamentos</h1><p>Agenda, status, edição e cancelamentos.</p></div><button id="novo" class="btn btn-primary">+ Novo agendamento</button></header><section class="panel"><div class="form-grid three"><div class="field"><label>Data</label><input id="fData" type="date"></div><div class="field"><label>Barbeiro</label><select id="fBarbeiro"><option value="">Todos</option></select></div><div class="field"><label>Status</label><select id="fStatus"><option value="">Todos</option><option>agendado</option><option>confirmado</option><option value="em_atendimento">em atendimento</option><option value="concluido">concluído</option><option value="cancelado">cancelado</option><option value="nao_compareceu">não compareceu</option></select></div></div><div id="msg" class="notice hidden"></div><div class="table-wrap" style="margin-top:16px"><table class="table"><thead><tr><th>Data</th><th>Hora</th><th>Cliente</th><th>Barbeiro</th><th>Serviço</th><th>Valor</th><th>Status</th><th>Ações</th></tr></thead><tbody id="lista"></tbody></table></div></section></main><div id="modal" class="modal hidden"><div class="modal-box"><div class="modal-head"><h2>Novo / Editar agendamento</h2><button id="fechar" class="close">×</button></div><input id="id" type="hidden"><div class="form-grid"><div class="field"><label>Cliente</label><select id="cliente"></select></div><div class="field"><label>Barbeiro</label><select id="barbeiro"></select></div><div class="field"><label>Serviço</label><select id="servico"></select></div><div class="field"><label>Data</label><input id="data" type="date"></div></div><div class="field" style="margin-top:15px"><label>Horário</label><div id="horarios" class="slots"><span class="muted">Selecione barbeiro, serviço e data.</span></div></div><div class="field" style="margin-top:15px"><label>Observações</label><textarea id="observacoes"></textarea></div><button id="salvar" class="btn btn-primary" style="margin-top:16px">Salvar agendamento</button></div></div><script src="/js/common.js"></script><script src="/js/agendamentos.js"></script></body></html>
