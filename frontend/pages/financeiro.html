<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Financeiro - BarberFlow</title><link rel="stylesheet" href="/style.css"></head><body class="auth-checking"><div id="shell"></div><main class="main"><header class="topbar"><div><h1>Financeiro</h1><p>Faturamento dos atendimentos concluídos.</p></div></header><div id="msg" class="notice hidden"></div><section class="panel"><div class="form-grid"><div class="field"><label>Início</label><input id="inicio" type="date"></div><div class="field"><label>Fim</label><input id="fim" type="date"></div></div><div class="cards" style="margin-top:18px"><div class="card"><div class="label">Faturamento</div><div class="value" id="fat">R$ 0</div></div><div class="card"><div class="label">Atendimentos</div><div class="value" id="qtd">0</div></div><div class="card"><div class="label">Ticket médio</div><div class="value" id="ticket">R$ 0</div></div></div><div id="graficosBox" style="margin-top:20px"></div><div class="table-wrap"><table class="table"><thead><tr><th>Data</th><th>Cliente</th><th>Barbeiro</th><th>Serviço</th><th>Valor</th></tr></thead><tbody id="lista"></tbody></table></div></section></main><script src="/js/common.js"></script><script>
if(requireAuth(['dono','gerente'])){
 document.getElementById('shell').innerHTML=renderShell('financeiro');if(!hasFeature('financeiro_basico')){document.querySelector('main.main').innerHTML='<header class="topbar"><div><h1>Financeiro</h1></div></header><div class="upgrade-card"><strong>🔒 Recurso Pro</strong><p>Financeiro fica disponível nos planos Pro e Premium.</p><a class="btn btn-primary" href="/pages/assinatura.html">Ver planos</a></div>';}else{const now=new Date(),first=new Date(now.getFullYear(),now.getMonth(),1);inicio.value=first.toISOString().slice(0,10);fim.value=now.toISOString().slice(0,10);
 async function load(){try{const r=await api(`/financeiro?inicio=${inicio.value}&fim=${fim.value}`);fat.textContent=money(r.total);qtd.textContent=r.quantidade;ticket.textContent=money(r.ticket_medio);lista.innerHTML=r.itens.length?r.itens.map(x=>`<tr><td>${dateBR(x.data)}</td><td>${esc(x.cliente)}</td><td>${esc(x.barbeiro)}</td><td>${esc(x.servico)}</td><td>${money(x.preco)}</td></tr>`).join(''):'<tr><td colspan="5">Nenhum atendimento concluído no período.</td></tr>'}catch(e){lista.innerHTML=`<tr><td colspan="5">${esc(e.message)}</td></tr>`}}
 async function graficos(){if(!hasFeature('financeiro_graficos')){graficosBox.innerHTML=`<div class="upgrade-card"><strong>🔒 Gráficos financeiros</strong><p>Disponível no Premium. Veja evolução mensal e desempenho dos barbeiros.</p><a class="btn btn-primary" href="/pages/assinatura.html">Ver Premium</a></div>`;return}try{const g=await api('/financeiro/graficos');const max=Math.max(1,...g.mensal.map(x=>Number(x.total||0)));graficosBox.innerHTML=`<div class="chart-grid"><div class="chart-card"><h3>Faturamento — últimos 6 meses</h3><div class="mini-bars">${g.mensal.map(x=>`<div class="mini-bar-row"><span>${esc(x.mes)}</span><div class="mini-bar-track"><div class="mini-bar-fill" style="width:${Math.max(4,Number(x.total||0)/max*100)}%"></div></div><strong>${money(x.total)}</strong></div>`).join('')||'<p class="muted">Ainda sem dados.</p>'}</div></div><div class="chart-card"><h3>Barbeiros neste mês</h3><div class="barber-rank">${g.barbeiros.map((x,i)=>`<div class="barber-rank-row"><strong>${i+1}. ${esc(x.nome)}</strong><span>${money(x.total)}</span><small>${x.atendimentos} atendimento(s)</small></div>`).join('')||'<p class="muted">Ainda sem dados.</p>'}</div></div></div>`}catch(e){graficosBox.innerHTML=`<div class="notice error">${esc(e.message)}</div>`}}
 inicio.onchange=fim.onchange=load;load();graficos();}
}
</script></body></html>
