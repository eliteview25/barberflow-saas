<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agendamento - BarberFlow</title><link rel="stylesheet" href="/style.css"></head><body class="public-bg"><main class="public-shell"><div class="public-brand"><div class="avatar">✂</div><div><h1 id="titulo" style="margin:0">Barbearia</h1><div class="muted" id="endereco"></div></div></div><div class="public-card"><h2>Agende seu horário</h2><div id="msg" class="notice hidden"></div><div class="form-grid"><div class="field"><label>Serviço</label><select id="servico"><option value="">Selecione</option></select></div><div class="field"><label>Barbeiro</label><select id="barbeiro"><option value="">Selecione</option></select></div><div class="field"><label>Data</label><input id="data" type="date"></div><div class="field"><label>Horário</label><div id="horarios" class="slots"><span class="muted">Selecione os dados acima.</span></div></div><div class="field"><label>Nome</label><input id="nome" autocomplete="name"></div><div class="field"><label>WhatsApp</label><input id="telefone" inputmode="tel" autocomplete="tel"></div><div class="field"><label>E-mail (opcional)</label><input id="email" type="email" autocomplete="email"></div></div><button id="agendar" class="btn btn-primary public-book-cta">Confirmar agendamento</button></div><div class="muted" style="text-align:center">Agendamento online por BarberFlow</div></main><script>const slug=location.pathname.split('/').filter(Boolean).pop();let hSel='';async function load(){const r=await fetch(`/api/publico/${slug}`);const d=await r.json();if(!r.ok)return alert(d.erro);titulo.textContent=d.barbearia.nome;endereco.textContent=[d.barbearia.endereco,d.barbearia.cidade,d.barbearia.estado].filter(Boolean).join(' • ');servico.innerHTML='<option value="">Selecione</option>'+d.servicos.map(s=>`<option value="${s.id}">${s.nome} • ${s.duracao} min • R$ ${Number(s.preco).toFixed(2)}</option>`).join('');barbeiro.innerHTML='<option value="">Selecione</option>'+d.barbeiros.map(b=>`<option value="${b.id}">${b.nome}</option>`).join('')}async function slots(){hSel='';if(!servico.value||!barbeiro.value||!data.value){horarios.innerHTML='<span class="muted">Selecione serviço, barbeiro e data.</span>';return}const r=await fetch(`/api/publico/${slug}/horarios?servico_id=${servico.value}&barbeiro_id=${barbeiro.value}&data=${data.value}`);const a=await r.json();horarios.innerHTML=a.length?a.map(h=>`<button type="button" class="slot" data-h="${h}">${h.slice(0,5)}</button>`).join(''):'<span class="muted">Sem horários disponíveis.</span>';document.querySelectorAll('.slot').forEach(b=>b.onclick=()=>{document.querySelectorAll('.slot').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');hSel=b.dataset.h})}servico.onchange=barbeiro.onchange=data.onchange=slots;agendar.onclick=async()=>{try{if(!hSel)throw new Error('Selecione um horário');const r=await fetch(`/api/publico/${slug}/agendar`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nome:nome.value,telefone:telefone.value,email:email.value,servico_id:Number(servico.value),barbeiro_id:Number(barbeiro.value),data:data.value,horario:hSel})});const d=await r.json();if(!r.ok)throw new Error(d.erro);msg.textContent='Agendamento realizado! Você já está na agenda.';msg.className='notice success';hSel='';await slots()}catch(e){msg.textContent=e.message;msg.className='notice error'}};data.min=new Date().toISOString().slice(0,10);load();</script></body></html>
