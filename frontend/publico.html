<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agendamento - BarberFlow</title><link rel="stylesheet" href="/style.css"></head><body class="public-bg"><main class="public-shell"><div class="public-brand"><div class="avatar">✂</div><div><h1 id="titulo" style="margin:0">Barbearia</h1><div class="muted" id="endereco"></div></div></div><div class="public-card"><h2>Agende seu horário</h2><div id="msg" class="notice hidden"></div><div id="pagamentoInfo" class="notice hidden"></div><div class="form-grid"><div class="field"><label>Serviço</label><select id="servico"><option value="">Selecione</option></select></div><div class="field"><label>Barbeiro</label><select id="barbeiro"><option value="">Selecione</option></select></div><div class="field"><label>Data</label><input id="data" type="date"></div><div class="field"><label>Horário</label><div id="horarios" class="slots"><span class="muted">Selecione os dados acima.</span></div></div><div class="field"><label>Nome</label><input id="nome" autocomplete="name"></div><div class="field"><label>WhatsApp</label><input id="telefone" inputmode="tel" autocomplete="tel"></div><div class="field"><label>E-mail (opcional)</label><input id="email" type="email" autocomplete="email"></div></div><button id="agendar" class="btn btn-primary public-book-cta">Confirmar agendamento</button></div><div class="muted" style="text-align:center">Agendamento online por BarberFlow</div></main><script>
const slug=location.pathname.split('/').filter(Boolean).pop();let hSel='';let cfg=null;const qs=new URLSearchParams(location.search);
function money(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
async function load(){const r=await fetch(`/api/publico/${slug}`);const d=await r.json();if(!r.ok)return alert(d.erro);cfg=d;titulo.textContent=d.barbearia.nome;endereco.textContent=[d.barbearia.endereco,d.barbearia.cidade,d.barbearia.estado].filter(Boolean).join(' • ');servico.innerHTML='<option value="">Selecione</option>'+d.servicos.map(s=>`<option value="${s.id}" data-preco="${s.preco}">${s.nome} • ${s.duracao} min • ${money(s.preco)}</option>`).join('');barbeiro.innerHTML='<option value="">Selecione</option>'+d.barbeiros.map(b=>`<option value="${b.id}">${b.nome}</option>`).join('');atualizarPagamentoInfo();await processarRetornoPagamento()}
function atualizarPagamentoInfo(){if(!cfg)return;const b=cfg.barbearia;if(b.pagamento_agendamento==='nenhum'){pagamentoInfo.className='notice hidden';agendar.textContent='Confirmar agendamento';return}const opt=servico.options[servico.selectedIndex];const preco=Number(opt?.dataset?.preco||0);const valor=b.pagamento_agendamento==='total'?preco:preco*Number(b.percentual_sinal||50)/100;pagamentoInfo.className='notice';pagamentoInfo.textContent=b.pagamento_agendamento==='total'?`Pagamento antecipado: ${money(valor)}. O agendamento só será confirmado após o pagamento.`:`Sinal de ${Number(b.percentual_sinal||50)}%: ${money(valor)}. O horário será confirmado após o pagamento.`;agendar.textContent='Reservar horário e pagar'}
async function slots(){hSel='';atualizarPagamentoInfo();if(!servico.value||!barbeiro.value||!data.value){horarios.innerHTML='<span class="muted">Selecione serviço, barbeiro e data.</span>';return}const r=await fetch(`/api/publico/${slug}/horarios?servico_id=${servico.value}&barbeiro_id=${barbeiro.value}&data=${data.value}`);const a=await r.json();horarios.innerHTML=a.length?a.map(h=>`<button type="button" class="slot" data-h="${h}">${h.slice(0,5)}</button>`).join(''):'<span class="muted">Sem horários disponíveis.</span>';document.querySelectorAll('.slot').forEach(b=>b.onclick=()=>{document.querySelectorAll('.slot').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');hSel=b.dataset.h})}
servico.onchange=barbeiro.onchange=data.onchange=slots;
agendar.onclick=async()=>{try{if(!hSel)throw new Error('Selecione um horário');agendar.disabled=true;agendar.textContent='Processando...';const r=await fetch(`/api/publico/${slug}/agendar`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nome:nome.value,telefone:telefone.value,email:email.value,servico_id:Number(servico.value),barbeiro_id:Number(barbeiro.value),data:data.value,horario:hSel})});const d=await r.json();if(!r.ok)throw new Error(d.erro);if(d.requires_payment){msg.textContent=`Horário reservado. Você será direcionado ao pagamento de ${money(d.valor_cobrado)}.`;msg.className='notice success';sessionStorage.setItem('bf_reserva',String(d.reserva_id));location.href=d.checkout_url;return}msg.textContent='Agendamento realizado! Você já está na agenda.';msg.className='notice success';hSel='';await slots()}catch(e){msg.textContent=e.message;msg.className='notice error';agendar.disabled=false;atualizarPagamentoInfo()}};
async function processarRetornoPagamento(){const reserva=qs.get('reserva');if(!reserva)return;msg.textContent='Verificando seu pagamento...';msg.className='notice';const paymentId=qs.get('payment_id')||qs.get('collection_id');if(paymentId){try{await fetch(`/api/publico/${slug}/reservas/${reserva}/sincronizar`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({payment_id:paymentId})})}catch{}}
for(let i=0;i<6;i++){try{const r=await fetch(`/api/publico/${slug}/reservas/${reserva}`);const d=await r.json();if(r.ok&&d.status==='confirmada'){msg.textContent='Pagamento aprovado! Seu agendamento está confirmado.';msg.className='notice success';return}if(r.ok&&d.status==='pagamento_aprovado_sem_vaga'){msg.textContent='Pagamento aprovado, mas houve conflito de horário. A barbearia fará a revisão do atendimento.';msg.className='notice error';return}if(r.ok&&['falha_pagamento'].includes(d.status)){msg.textContent='Não foi possível concluir o pagamento. Escolha o horário novamente.';msg.className='notice error';return}}catch{}await new Promise(x=>setTimeout(x,1500))}msg.textContent='Pagamento em processamento. Assim que aprovado, o agendamento será confirmado automaticamente.';msg.className='notice'}
data.min=new Date().toISOString().slice(0,10);load();
</script></body></html>
