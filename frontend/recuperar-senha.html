<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recuperar senha - BarberFlow</title><link rel="stylesheet" href="/style.css"></head><body class="auth-body"><main class="auth-card"><div class="logo">Barber<span>Flow</span></div><h1>Recuperar senha</h1><p class="muted">Informe seu e-mail.</p><div id="msg" class="notice hidden"></div><div class="field"><label>E-mail</label><input id="email" type="email"></div><button id="btn" class="btn btn-primary" style="width:100%">Gerar recuperação</button><p class="muted"><a href="/login.html">Voltar ao login</a></p></main><script src="/js/common.js"></script><script>btn.onclick=async()=>{const r=await fetch('/api/auth/solicitar-reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value})});const d=await r.json();msg.className='notice success';msg.innerHTML=d.link_dev?`${d.mensagem}<br><a href="${d.link_dev}">Abrir link de desenvolvimento</a>`:d.mensagem}</script></body></html>
