<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nova senha - BarberFlow</title><link rel="stylesheet" href="/style.css"></head><body class="auth-body"><main class="auth-card"><div class="logo">Barber<span>Flow</span></div><h1>Nova senha</h1><div id="msg" class="notice hidden"></div><div class="field"><label>Nova senha</label><input id="senha" type="password" minlength="8"></div><button id="btn" class="btn btn-primary" style="width:100%">Atualizar senha</button></main><script>const token=new URLSearchParams(location.search).get('token');btn.onclick=async()=>{const r=await fetch('/api/auth/redefinir-senha',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,senha:senha.value})});const d=await r.json();msg.className='notice '+(r.ok?'success':'error');msg.textContent=d.mensagem||d.erro;if(r.ok)setTimeout(()=>location.href='/login.html',1200)}</script></body></html>
