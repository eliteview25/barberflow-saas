<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Criar conta - BarberFlow</title><link rel="stylesheet" href="/style.css"></head><body class="auth-body"><main class="auth-card"><div class="logo">Barber<span>Flow</span></div><h1>Começar grátis</h1><p class="muted">14 dias para testar o BarberFlow Pro.</p><div id="msg" class="notice hidden"></div><form id="form"><div class="field"><label>Nome da barbearia</label><input id="barbearia" required></div><div class="field"><label>Seu nome</label><input id="nome" required></div><div class="field"><label>WhatsApp</label><input id="telefone"></div><div class="field"><label>E-mail</label><input id="email" type="email" required></div><div class="field"><label>Senha</label><input id="senha" type="password" minlength="8" required></div><button class="btn btn-primary" style="width:100%">Criar conta</button></form><p class="muted" style="margin-top:18px">Já tem conta? <a href="/login.html" style="color:#d97706;font-weight:700">Entrar</a></p></main><script src="/js/common.js"></script><script>document.getElementById('form').onsubmit=async e=>{e.preventDefault();try{const r=await fetch('/api/auth/registrar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({barbearia:barbearia.value,nome:nome.value,telefone:telefone.value,email:email.value,senha:senha.value})});const d=await r.json();if(!r.ok)throw new Error(d.erro);localStorage.setItem('bf_token',d.token);localStorage.setItem('bf_user',JSON.stringify(d.usuario));location.href='/'}catch(err){flash(document.getElementById('msg'),err.message,'error')}};</script></body></html>
