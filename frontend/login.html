<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar - BarberFlow</title><link rel="stylesheet" href="/style.css"></head><body class="auth-body"><main class="auth-card"><div class="logo">Barber<span>Flow</span></div><h1>Entrar</h1><p class="muted">Acesse o painel da sua barbearia.</p><div id="msg" class="notice hidden"></div><form id="form"><div class="field"><label>E-mail</label><input id="email" type="email" required></div><div class="field"><label>Senha</label><input id="senha" type="password" required></div><button class="btn btn-dark" style="width:100%">Entrar</button></form><p class="muted"><a href="/recuperar-senha.html">Esqueci minha senha</a></p><p class="muted" style="margin-top:18px">Ainda não tem conta? <a href="/cadastro.html" style="color:#d97706;font-weight:700">Criar barbearia</a></p></main><script src="/js/common.js"></script><script>if(token())location.href=currentUser().papel==='super_admin'?'/master.html':'/';document.getElementById('form').onsubmit=async e=>{e.preventDefault();const m=document.getElementById('msg');try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,senha:senha.value})});const d=await r.json();if(!r.ok)throw new Error(d.erro);localStorage.setItem('bf_token',d.token);localStorage.setItem('bf_user',JSON.stringify(d.usuario));location.href=d.usuario.papel==='super_admin'?'/master.html':'/'}catch(err){flash(m,err.message,'error')}};</script></body></html>
